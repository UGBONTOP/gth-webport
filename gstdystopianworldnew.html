<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>GST Dystopian World: Webported By Prim</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #4F0B10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: sans-serif;
        color: #fff;
      }
      #game-container {
        position: relative;
        width: 960px;
        height: 600px;
        display: none;
      }
      body.is-fullscreen #game-container {
        width: 100vw;
        height: 100vh;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #4F0B10;
        display: block;
      }
      #fullscreen-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #fff;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 4px;
        cursor: pointer;
      }
      #fullscreen-btn:hover {
        background: rgba(0,0,0,0.8);
      }
      #loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: 480px;
      }
      #loader-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #ffcdd2;
      }
      #loader-update-label {
        font-size: 11px;
        letter-spacing: 0.06em;
        color: rgba(255,205,210,0.55);
        margin-top: -10px;
      }
      #update-badge {
        position: fixed;
        right: 12px;
        bottom: 10px;
        z-index: 1000;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: rgba(255,255,255,0.45);
        background: rgba(0,0,0,0.4);
        padding: 3px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
      #status-text {
        font-size: 13px;
        color: #ef9a9a;
        min-height: 18px;
        text-align: center;
      }
      .bar-track {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.15);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 4px;
        background: #ef5350;
        width: 0%;
        transition: width 0.1s;
      }
      .file-row {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .file-label {
        font-size: 11px;
        color: rgba(255,255,255,0.5);
        display: flex;
        justify-content: space-between;
      }

      /* ── Chat panel (top-left, self-contained login) ─────────────── */
      #chat-panel {
        position: fixed;
        left: 12px;
        top: 12px;
        width: 300px;
        display: flex;
        flex-direction: column;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 6px;
        overflow: hidden;
        z-index: 1000;
        font-size: 13px;
      }
      #chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        background: rgba(0,0,0,0.4);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: rgba(255,255,255,0.6);
        gap: 8px;
      }
      #chat-header span#chat-user-label { color: #ffcdd2; }
      #chat-header-buttons {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      #chat-signout-btn, #chat-toggle-btn {
        background: none;
        border: none;
        color: rgba(255,255,255,0.5);
        cursor: pointer;
        font-size: 11px;
      }
      #chat-toggle-btn {
        font-size: 13px;
        line-height: 1;
      }
      #chat-body-wrap.collapsed { display: none; }

      /* login view, shown inside the chat panel when signed out */
      #chat-login-view {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
      }
      #chat-login-view input {
        padding: 8px 10px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.06);
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      #chat-login-view input:focus { border-color: #ef5350; }
      .auth-btn-row {
        display: flex;
        gap: 8px;
      }
      #chat-login-view button {
        flex: 1;
        padding: 7px 8px;
        border: none;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #login-btn { background: #ef5350; color: #fff; }
      #register-btn { background: rgba(255,255,255,0.12); color: #fff; }
      #auth-error {
        color: #ff8a80;
        font-size: 11px;
        min-height: 14px;
      }

      /* chat view, shown inside the chat panel when signed in */
      #chat-view {
        display: none;
        flex-direction: column;
      }
      #chat-messages {
        overflow-y: auto;
        padding: 6px 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        max-height: 180px;
      }
      #chat-messages::-webkit-scrollbar { width: 6px; }
      #chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
      .chat-line {
        line-height: 1.4;
        word-wrap: break-word;
      }
      .chat-line .chat-name {
        font-weight: 700;
        color: #ff8a80;
        margin-right: 4px;
      }
      .chat-line .chat-name.self { color: #80d8ff; }
      .chat-line .chat-update-tag {
        color: rgba(255,255,255,0.4);
        font-size: 11px;
      }
      .chat-line .chat-text { color: #fff; }
      #chat-input-row {
        display: flex;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      #chat-input {
        flex: 1;
        padding: 8px 10px;
        background: rgba(255,255,255,0.05);
        border: none;
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      #chat-send {
        padding: 8px 12px;
        border: none;
        background: #ef5350;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>

    <!-- ── Chat panel: login form OR live chat, gated by sign-in ──── -->
    <div id="chat-panel">
      <div id="chat-header">
        <span id="chat-header-label">CHAT — sign in</span>
        <div id="chat-header-buttons">
          <button id="chat-signout-btn" type="button" style="display:none;">sign out</button>
          <button id="chat-toggle-btn" type="button" title="Show/hide chat">–</button>
        </div>
      </div>

      <div id="chat-body-wrap">
        <div id="chat-login-view">
          <input id="auth-username" type="text" placeholder="Username" autocomplete="username" maxlength="20" />
          <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" />
          <div id="auth-error"></div>
          <div class="auth-btn-row">
            <button id="login-btn" type="button">Log In</button>
            <button id="register-btn" type="button">Register</button>
          </div>
        </div>

        <div id="chat-view">
          <div id="chat-messages"></div>
          <div id="chat-input-row">
            <input id="chat-input" type="text" placeholder="Say something…" maxlength="240" />
            <button id="chat-send" type="button">Send</button>
          </div>
        </div>
      </div>
    </div>

    <div id="game-container">
      <button id="fullscreen-btn" type="button">⛶ Fullscreen</button>
      <canvas id="unity-canvas" width=960 height=600></canvas>
    </div>

    <div id="update-badge"></div>

    <div id="loader">
      <div id="loader-title">Loading GST Dystopian World Webported By Prim</div>
      <div id="loader-update-label"></div>

      <div class="file-row">
        <div class="file-label">
          <span>.data <span id="data-parts-label"></span></span>
          <span id="data-pct">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="data-bar"></div></div>
      </div>

      <div class="file-row">
        <div class="file-label">
          <span>.wasm <span id="wasm-parts-label"></span></span>
          <span id="wasm-pct">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="wasm-bar"></div></div>
      </div>

      <div id="status-text">Fetching parts…</div>
    </div>

    <script>
      const GH_USER   = "UGBONTOP";
      const GH_REPO   = "fornewqcachae";
      const GH_BRANCH = "main";
      const CDN_ROOT  = `https://cdn.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@${GH_BRANCH}/Build`;

      const UPDATE_NAME = "GST Dystopian Times";
      document.getElementById("update-badge").textContent = UPDATE_NAME;
      document.getElementById("loader-update-label").textContent = UPDATE_NAME;
    </script>

    <script>
      function loadUnityLoaderScript() {
        const s = document.createElement("script");
        s.src = `${CDN_ROOT}/GST WEBPORT 2 STUFF.loader.js`;
        s.onload = () => main();
        s.onerror = () => {
          document.getElementById("status-text").textContent =
            "❌ Failed to load loader.js from jsDelivr — check GH_USER/GH_REPO/GH_BRANCH.";
        };
        document.head.appendChild(s);
      }
    </script>

    <script>
      loadUnityLoaderScript();
    </script>

    <script type="module">
      import {
        initializeApp
      } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
      import {
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
        updateProfile, onAuthStateChanged, signOut
      } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
      import {
        getFirestore, collection, addDoc, query, orderBy, limit,
        onSnapshot, serverTimestamp
      } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBK0s3rUBctLuujd0aT_qyTjurS1fdm0ZM",
        authDomain: "prims-gth-webports.firebaseapp.com",
        projectId: "prims-gth-webports",
        storageBucket: "prims-gth-webports.firebasestorage.app",
        messagingSenderId: "35674041142",
        appId: "1:35674041142:web:d758759642fdc151dfa197"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const EMAIL_DOMAIN = "users.prims-gth-webports.local";
      const USERNAME_RE = /^[a-zA-Z0-9_]{3,20}$/;

      function usernameToEmail(username) {
        return `${username.toLowerCase()}@${EMAIL_DOMAIN}`;
      }

      const usernameInput   = document.getElementById("auth-username");
      const passwordInput   = document.getElementById("auth-password");
      const authError       = document.getElementById("auth-error");
      const loginBtn        = document.getElementById("login-btn");
      const registerBtn     = document.getElementById("register-btn");

      const chatHeaderLabel = document.getElementById("chat-header-label");
      const chatSignOutBtn  = document.getElementById("chat-signout-btn");
      const chatLoginView   = document.getElementById("chat-login-view");
      const chatView        = document.getElementById("chat-view");
      const chatMessages    = document.getElementById("chat-messages");
      const chatInput       = document.getElementById("chat-input");
      const chatSendBtn     = document.getElementById("chat-send");

      let unsubscribeChat = null;

      function showAuthError(msg) { authError.textContent = msg; }

      function setBusy(busy) {
        loginBtn.disabled = busy;
        registerBtn.disabled = busy;
      }

      function validateInputs() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!USERNAME_RE.test(username)) {
          showAuthError("Username: 3-20 letters/numbers/underscore.");
          return null;
        }
        if (password.length < 6) {
          showAuthError("Password must be at least 6 characters.");
          return null;
        }
        return { username, password };
      }

      registerBtn.addEventListener("click", async () => {
        const creds = validateInputs();
        if (!creds) return;
        showAuthError("");
        setBusy(true);
        try {
          const cred = await createUserWithEmailAndPassword(
            auth, usernameToEmail(creds.username), creds.password
          );
          await updateProfile(cred.user, { displayName: creds.username });
        } catch (err) {
          showAuthError(friendlyAuthError(err));
        } finally {
          setBusy(false);
        }
      });

      loginBtn.addEventListener("click", async () => {
        const creds = validateInputs();
        if (!creds) return;
        showAuthError("");
        setBusy(true);
        try {
          await signInWithEmailAndPassword(
            auth, usernameToEmail(creds.username), creds.password
          );
        } catch (err) {
          showAuthError(friendlyAuthError(err));
        } finally {
          setBusy(false);
        }
      });

      chatSignOutBtn.addEventListener("click", () => signOut(auth));

      function friendlyAuthError(err) {
        switch (err.code) {
          case "auth/email-already-in-use": return "That username is taken.";
          case "auth/invalid-credential":
          case "auth/wrong-password":
          case "auth/user-not-found": return "Wrong username or password.";
          case "auth/weak-password": return "Password too weak (min 6 chars).";
          default: return "Something went wrong. Try again.";
        }
      }

      function renderMessage(msg, myUid) {
        const line = document.createElement("div");
        line.className = "chat-line";
        const nameSpan = document.createElement("span");
        nameSpan.className = "chat-name" + (msg.uid === myUid ? " self" : "");
        nameSpan.textContent = msg.username;
        line.appendChild(nameSpan);
        if (msg.update) {
          const updateSpan = document.createElement("span");
          updateSpan.className = "chat-update-tag";
          updateSpan.textContent = " [" + msg.update + "]";
          line.appendChild(updateSpan);
        }
        const colonSpan = document.createElement("span");
        colonSpan.className = "chat-name" + (msg.uid === myUid ? " self" : "");
        colonSpan.textContent = ":";
        line.appendChild(colonSpan);
        const textSpan = document.createElement("span");
        textSpan.className = "chat-text";
        textSpan.textContent = " " + msg.text; // textContent -> no HTML/script injection
        line.appendChild(textSpan);
        return line;
      }

      function startChatListener(user) {
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(50));
        unsubscribeChat = onSnapshot(q, (snapshot) => {
          chatMessages.innerHTML = "";
          snapshot.forEach((doc) => {
            chatMessages.appendChild(renderMessage(doc.data(), user.uid));
          });
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, (err) => {
          console.error("chat listener failed:", err);
        });
      }

      async function sendChatMessage() {
        const user = auth.currentUser;
        const text = chatInput.value.trim();
        if (!user || !text) return;
        chatInput.value = "";
        try {
          await addDoc(collection(db, "messages"), {
            uid: user.uid,
            username: user.displayName || "anon",
            update: UPDATE_NAME,
            text: text.slice(0, 240),
            createdAt: serverTimestamp(),
          });
        } catch (err) {
          console.error("chat send failed:", err);
        }
      }

      chatSendBtn.addEventListener("click", sendChatMessage);

      /* ── Focus arbitration between chat and the Unity gameframe ───
         - chatModeActive tracks who currently "owns" the keyboard.
         - Clicking anywhere in the chat panel: chatModeActive = true,
           canvas is explicitly blurred, and the chat input grabs focus.
         - Clicking the gameframe: chatModeActive = false, any focused
           chat field is blurred. Chat won't intercept keys again until
           the chat panel is clicked again.
         - guardGameKeys uses stopImmediatePropagation (not just
           stopPropagation) because Unity's own keyboard listeners are
           also attached to window; stopPropagation alone does not stop
           other listeners already registered on the same target.     */
      let chatModeActive = false;
      const chatPanelEl = document.getElementById("chat-panel");
      const gameContainerEl = document.getElementById("game-container");
      const gameCanvasEl = document.getElementById("unity-canvas");
      const chatToggleBtn = document.getElementById("chat-toggle-btn");
      const chatBodyWrap = document.getElementById("chat-body-wrap");
      let chatCollapsed = false;

      chatPanelEl.addEventListener("mousedown", () => {
        if (chatCollapsed) return;
        chatModeActive = true;

        // Explicitly drop focus from the game canvas (or anything else
        // outside the chat panel) so Unity stops treating it as the
        // active input target.
        if (document.activeElement &&
            document.activeElement !== document.body &&
            !chatPanelEl.contains(document.activeElement)) {
          document.activeElement.blur();
        }
        if (gameCanvasEl && document.activeElement === gameCanvasEl) {
          gameCanvasEl.blur();
        }

        if (chatView.style.display !== "none") {
          setTimeout(() => { if (chatModeActive) chatInput.focus(); }, 0);
        }
      });

      gameContainerEl.addEventListener("mousedown", () => {
        chatModeActive = false;
        if (document.activeElement && chatPanelEl.contains(document.activeElement)) {
          document.activeElement.blur();
        }
      });

      setInterval(() => {
        if (chatModeActive && !chatCollapsed && chatView.style.display !== "none"
            && document.activeElement !== chatInput) {
          chatInput.focus();
        }
      }, 100);

      chatToggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        chatCollapsed = !chatCollapsed;
        chatBodyWrap.classList.toggle("collapsed", chatCollapsed);
        chatToggleBtn.textContent = chatCollapsed ? "+" : "–";
        if (chatCollapsed) {
          chatModeActive = false;
          if (document.activeElement && chatPanelEl.contains(document.activeElement)) {
            document.activeElement.blur();
          }
        }
      });

      function guardGameKeys(e) {
        if (!chatModeActive) return;
        if (e.type === "keydown" && e.key === "Enter" && e.target && e.target.id === "chat-input") {
          sendChatMessage();
        }
        // stopImmediatePropagation, not stopPropagation: Unity's own
        // keyboard listeners are also bound to window, and
        // stopPropagation does not stop other listeners on the same
        // element — only stopImmediatePropagation does.
        e.stopImmediatePropagation();
      }
      window.addEventListener("keydown", guardGameKeys, true);
      window.addEventListener("keyup", guardGameKeys, true);
      window.addEventListener("keypress", guardGameKeys, true);

      onAuthStateChanged(auth, (user) => {
        if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }

        if (user) {
          chatHeaderLabel.textContent = "CHAT — " + (user.displayName || "anon");
          chatSignOutBtn.style.display = "inline";
          chatLoginView.style.display = "none";
          chatView.style.display = "flex";
          startChatListener(user);
        } else {
          chatHeaderLabel.textContent = "CHAT — sign in";
          chatSignOutBtn.style.display = "none";
          chatLoginView.style.display = "flex";
          chatView.style.display = "none";
          usernameInput.value = "";
          passwordInput.value = "";
          showAuthError("");
        }
      });
    </script>

    <script>
      const PARTS_BASE = `${CDN_ROOT}/PARTS/GST_WEBPORT_STUFF`;

      const FILES = [
        {
          key:    "data",
          prefix: `${PARTS_BASE}/GST_WEBPORT_2_STUFF.data.part`,
          count:  19,
          barEl:  null, pctEl: null, labelEl: null,
        },
        {
          key:    "wasm",
          prefix: `${PARTS_BASE}/GST_WEBPORT_2_STUFF.wasm.part`,
          count:  3,
          barEl:  null, pctEl: null, labelEl: null,
        },
      ];

      function pad(n) { return String(n).padStart(3, "0"); }

      function setBar(entry, pct) {
        entry.barEl.style.width = pct + "%";
        entry.pctEl.textContent = Math.round(pct) + "%";
      }

      async function assembleFile(entry) {
        const buffers = [];
        for (let i = 1; i <= entry.count; i++) {
          const url = entry.prefix + pad(i);
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`Failed to fetch ${url} (${resp.status})`);
          buffers.push(await resp.arrayBuffer());
          setBar(entry, (i / entry.count) * 100);
          entry.labelEl.textContent = `(part ${i}/${entry.count})`;
        }
        const total = buffers.reduce((s, b) => s + b.byteLength, 0);
        const merged = new Uint8Array(total);
        let offset = 0;
        for (const buf of buffers) {
          merged.set(new Uint8Array(buf), offset);
          offset += buf.byteLength;
        }
        const mime = entry.key === "wasm" ? "application/wasm" : "application/octet-stream";
        return new Blob([merged], { type: mime });
      }

      function setupFullscreenButton(unityInstance) {
        const btn = document.getElementById("fullscreen-btn");

        function isFullscreen() {
          return document.fullscreenElement || document.webkitFullscreenElement;
        }

        btn.addEventListener("click", () => {
          if (!isFullscreen()) {
            const el = document.documentElement;
            const req = el.requestFullscreen || el.webkitRequestFullscreen;
            if (req) req.call(el);
          } else {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) exit.call(document);
          }
        });

        function onFullscreenChange() {
          const fs = isFullscreen();
          btn.textContent = fs ? "⤢ Exit Fullscreen" : "⛶ Fullscreen";
          document.body.classList.toggle("is-fullscreen", !!fs);
          if (unityInstance && typeof unityInstance.SetFullscreen === "function") {
            unityInstance.SetFullscreen(fs ? 1 : 0);
          }
          window.dispatchEvent(new Event("resize"));
        }

        document.addEventListener("fullscreenchange", onFullscreenChange);
        document.addEventListener("webkitfullscreenchange", onFullscreenChange);
      }

      async function main() {
        const statusEl = document.getElementById("status-text");

        FILES[0].barEl   = document.getElementById("data-bar");
        FILES[0].pctEl   = document.getElementById("data-pct");
        FILES[0].labelEl = document.getElementById("data-parts-label");
        FILES[1].barEl   = document.getElementById("wasm-bar");
        FILES[1].pctEl   = document.getElementById("wasm-pct");
        FILES[1].labelEl = document.getElementById("wasm-parts-label");

        let dataUrl, wasmUrl;

        try {
          statusEl.textContent = "Assembling .data…";
          const dataBlob = await assembleFile(FILES[0]);
          dataUrl = URL.createObjectURL(dataBlob);

          statusEl.textContent = "Assembling .wasm…";
          const wasmBlob = await assembleFile(FILES[1]);
          wasmUrl = URL.createObjectURL(wasmBlob);
        } catch (err) {
          statusEl.textContent = "❌ " + err.message;
          console.error(err);
          return;
        }

        statusEl.textContent = "Starting game…";
        document.getElementById("loader").style.display = "none";
        document.getElementById("game-container").style.display = "block";

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
          var canvas = document.querySelector("#unity-canvas");
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          canvas.style.position = "fixed";
          document.body.style.textAlign = "left";
        }

        createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl:            dataUrl,
