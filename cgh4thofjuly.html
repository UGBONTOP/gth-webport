<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Prims 4th of July 2024</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        background: #231F20;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-wrapper {
        position: relative;
        width: 960px;
        height: 600px;
        transform-origin: center center;
        flex-shrink: 0;
      }

      #unity-canvas {
        width: 960px;
        height: 600px;
        background: #231F20;
        display: block;
      }

      #fullscreen-btn {
        position: absolute;
        bottom: 10px;
        right: 10px;
        width: 36px;
        height: 36px;
        background: rgba(0, 0, 0, 0.55);
        border: 1.5px solid rgba(255,255,255,0.25);
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, opacity 0.2s;
        z-index: 10;
        opacity: 0.7;
      }
      #fullscreen-btn:hover { background: rgba(0,0,0,0.85); opacity: 1; }
      #fullscreen-btn svg { width: 18px; height: 18px; fill: #fff; }

      #loading-overlay {
        position: absolute;
        inset: 0;
        background: #231F20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        color: #fff;
        font-family: 'Courier New', monospace;
        gap: 16px;
      }
      #loading-overlay.hidden { display: none; }

      #loading-bar-bg {
        width: 300px;
        height: 6px;
        background: rgba(255,255,255,0.12);
        border-radius: 3px;
        overflow: hidden;
      }
      #loading-bar-fill {
        height: 100%;
        width: 0%;
        background: #e0e0e0;
        border-radius: 3px;
        transition: width 0.3s ease;
      }
      #loading-text {
        font-size: 12px;
        color: rgba(255,255,255,0.5);
        letter-spacing: 0.08em;
      }
      #loading-status {
        font-size: 10px;
        color: rgba(255,255,255,0.35);
        letter-spacing: 0.05em;
      }

      :fullscreen #fullscreen-btn,
      :-webkit-full-screen #fullscreen-btn,
      :-moz-full-screen #fullscreen-btn {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="unity-canvas" width="960" height="600"></canvas>

      <button id="fullscreen-btn" title="Fullscreen (F11)">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/>
        </svg>
      </button>

      <div id="loading-overlay">
        <div id="loading-text">LOADING... 0%</div>
        <div id="loading-bar-bg"><div id="loading-bar-fill"></div></div>
        <div id="loading-status">Preparing...</div>
      </div>
    </div>

    <script>
    (function () {
      const CDN_BASE = 'https://cdn.jsdelivr.net/gh/UGBONTOP/randomhtmlstuffidfk@main/Build';

      const DATA_PARTS = 37;
      const WASM_PARTS =  3;

      // part19 was corrupted on the original repo (served as a Git LFS pointer file
      // instead of the real ~15MB chunk) — re-hosted on a separate repo instead.
      const PART_OVERRIDES = {
        19: 'https://cdn.jsdelivr.net/gh/UGBONTOP/AQRDAWD@main/cgh%20webgl.part19',
      };

      function dataPartUrl(i) {
        if (PART_OVERRIDES[i]) return PART_OVERRIDES[i];
        const n = String(i).padStart(2, '0');
        return `${CDN_BASE}/data/cgh webgl.part${n}`;
      }
      function wasmPartUrl(i) {
        return `${CDN_BASE}/wasm/cgh webgl.part${i}`;
      }

      const dataUrls = Array.from({ length: DATA_PARTS }, (_, i) => dataPartUrl(i + 1));
      const wasmUrls = Array.from({ length: WASM_PARTS }, (_, i) => wasmPartUrl(i + 1));

      // ---- UI helpers ----
      function setBar(pct) {
        document.getElementById('loading-bar-fill').style.width = Math.min(100, pct).toFixed(1) + '%';
      }
      function setText(msg) { document.getElementById('loading-text').textContent = msg; }
      function setStatus(msg) { document.getElementById('loading-status').textContent = msg; }

      // ---- Fetch + combine parts into ONE buffer, then hand Unity a real blob URL ----
      // (No window.fetch / XMLHttpRequest patching — that breaks under file:// and causes
      // wasm runtime crashes.)
      async function fetchPart(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
        return res.arrayBuffer();
      }

      async function fetchAndCombine(urls, label, barStart, barEnd) {
        const buffers = [];
        for (let i = 0; i < urls.length; i++) {
          setStatus(`Downloading ${label} part ${i + 1} / ${urls.length}`);
          buffers.push(await fetchPart(urls[i]));
          setBar(barStart + (barEnd - barStart) * ((i + 1) / urls.length));
        }
        const total = buffers.reduce((sum, b) => sum + b.byteLength, 0);
        const merged = new Uint8Array(total);
        let offset = 0;
        for (const buf of buffers) {
          merged.set(new Uint8Array(buf), offset);
          offset += buf.byteLength;
        }
        return merged.buffer;
      }

      function loadScript(url) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          s.onload = resolve;
          s.onerror = () => reject(new Error('Script load failed: ' + url));
          document.head.appendChild(s);
        });
      }

      // ---- Responsive scaling ----
      const GAME_ASPECT = 960 / 600;

      function scaleGame() {
        const canvas  = document.getElementById('unity-canvas');
        const wrapper = document.getElementById('game-wrapper');
        const fs = !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement
        );

        let w, h;
        if (fs) {
          w = screen.width;
          h = screen.height;
        } else {
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          if (vw / vh > GAME_ASPECT) {
            h = vh;
            w = Math.round(h * GAME_ASPECT);
          } else {
            w = vw;
            h = Math.round(w / GAME_ASPECT);
          }
        }

        wrapper.style.width  = w + 'px';
        wrapper.style.height = h + 'px';
        wrapper.style.transform = '';

        canvas.style.width  = w + 'px';
        canvas.style.height = h + 'px';
        canvas.width  = w;
        canvas.height = h;
      }

      scaleGame();
      window.addEventListener('resize', scaleGame);

      // ---- Boot ----
      async function boot() {
        setText('LOADING... 0%');
        setStatus('Fetching loader script...');

        await loadScript(`${CDN_BASE}/cgh webgl.loader.js`);
        setBar(2);

        setStatus('Downloading data...');
        const dataBuffer = await fetchAndCombine(dataUrls, 'DATA', 2, 70);

        setStatus('Downloading wasm...');
        const wasmBuffer = await fetchAndCombine(wasmUrls, 'WASM', 70, 92);

        setStatus('Preparing blobs...');
        const dataObjectUrl = URL.createObjectURL(new Blob([dataBuffer], { type: 'application/octet-stream' }));
        const wasmObjectUrl = URL.createObjectURL(new Blob([wasmBuffer], { type: 'application/wasm' }));
        setBar(94);

        document.getElementById('loading-overlay').classList.add('hidden');

        await createUnityInstance(document.querySelector('#unity-canvas'), {
          dataUrl:            dataObjectUrl,
          frameworkUrl:       `${CDN_BASE}/cgh webgl.framework.js`,
          codeUrl:            wasmObjectUrl,
          streamingAssetsUrl: `${CDN_BASE.replace('/Build', '')}/StreamingAssets`,
          companyName:        'Luminositcal',
          productName:        'GTH (CLOUD EDITION)',
          productVersion:     '11.0.0',
        }, (progress) => {
          setText('LOADING... ' + Math.round(progress * 100) + '%');
        });

        setBar(100);
        URL.revokeObjectURL(dataObjectUrl);
        URL.revokeObjectURL(wasmObjectUrl);
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.head.appendChild(meta);

        const canvas = document.querySelector('#unity-canvas');
        canvas.style.width  = '100%';
        canvas.style.height = '100%';
        canvas.style.position = 'fixed';
        document.body.style.textAlign = 'left';
      }

      boot().catch(err => {
        setText('ERROR: ' + err.message);
        console.error(err);
      });

      const wrapper = document.getElementById('game-wrapper');
      const btn     = document.getElementById('fullscreen-btn');

      function enterFullscreen() {
        const el = wrapper;
        if (el.requestFullscreen)            el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
      }

      function exitFullscreen() {
        if (document.exitFullscreen)            document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
      }

      function isFullscreen() {
        return !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement
        );
      }

      btn.addEventListener('click', () => {
        isFullscreen() ? exitFullscreen() : enterFullscreen();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'F11') {
          e.preventDefault();
          isFullscreen() ? exitFullscreen() : enterFullscreen();
        }
      });

      function updateBtnIcon() {
        if (isFullscreen()) {
          btn.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;fill:#fff">
            <path d="M9 3H7v4H3v2h6V3zm6 0h-2v6h6V7h-4V3zM3 13v2h4v4h2v-6H3zm14 4v-4h-2v6h6v-2h-4z"/>
          </svg>`;
        } else {
          btn.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;fill:#fff">
            <path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/>
          </svg>`;
        }
      }

      document.addEventListener('fullscreenchange',       () => { updateBtnIcon(); scaleGame(); });
      document.addEventListener('webkitfullscreenchange', () => { updateBtnIcon(); scaleGame(); });
      document.addEventListener('mozfullscreenchange',    () => { updateBtnIcon(); scaleGame(); });

    })();
    </script>
  </body>
</html>
