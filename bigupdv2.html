<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>CGH Webported: Big Update V2</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #231F20;
      }
      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #231F20;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        background: #231F20;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 16px;
        z-index: 9999;
        gap: 16px;
      }
      #loading-bar-outer {
        width: 360px;
        height: 12px;
        background: #444;
        border-radius: 6px;
        overflow: hidden;
      }
      #loading-bar-inner {
        height: 100%;
        width: 0%;
        background: #e04040;
        border-radius: 6px;
        transition: width 0.2s ease;
      }
      #loading-status {
        font-size: 13px;
        color: #aaa;
      }

      /* ---------- Mobile touch controls ---------- */
      #mobile-controls {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: none;
        touch-action: none;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #mobile-controls.active { display: block; }

      #look-layer {
        position: absolute;
        inset: 0;
        pointer-events: auto;
        touch-action: none;
      }

      #joystick-zone {
        position: absolute;
        left: 24px;
        bottom: 24px;
        width: 140px;
        height: 140px;
        pointer-events: auto;
        touch-action: none;
      }
      #joystick-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.10);
        border: 2px solid rgba(255, 255, 255, 0.25);
      }
      #joystick-stick {
        position: absolute;
        width: 56px;
        height: 56px;
        left: 42px;
        top: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.6);
        transform: translate(0, 0);
        transition: transform 0.05s linear;
      }

      #action-buttons {
        position: absolute;
        right: 24px;
        bottom: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        pointer-events: auto;
      }
      .mobile-btn {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(224, 64, 64, 0.35);
        color: #fff;
        font-family: monospace;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        pointer-events: auto;
      }
      .mobile-btn.pressed {
        background: rgba(224, 64, 64, 0.65);
        border-color: rgba(255, 255, 255, 0.7);
      }
      #jump-btn { width: 96px; height: 96px; font-size: 14px; }
      #sprint-btn { width: 76px; height: 76px; font-size: 12px; }

      #mobile-tap-hint {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: none;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: monospace;
        font-size: 15px;
        background: rgba(0,0,0,0.35);
        text-align: center;
        padding: 20px;
      }
      #mobile-tap-hint.active { display: flex; }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div id="loading-label">Loading game files...</div>
      <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
      <div id="loading-status">Preparing...</div>
    </div>

    <canvas id="unity-canvas"></canvas>

    <div id="mobile-tap-hint">Tap anywhere to enable touch controls</div>

    <div id="mobile-controls">
      <div id="look-layer"></div>
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>
      <div id="action-buttons">
        <button id="sprint-btn" class="mobile-btn">SPRINT</button>
        <button id="jump-btn" class="mobile-btn">JUMP</button>
      </div>
    </div>

    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      const LOADER_URL = 'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/cgh%20big%20update%20v2.loader.js';

      const FRAMEWORK_URL = 'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/cgh%20big%20update%20v2.framework.js';

      const DATA_PARTS = [
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part01',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part02',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part03',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part04',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part05',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part06',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part07',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part08',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part09',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part10',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part11',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part12',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part13',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part14',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part15',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part16',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part17',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part18',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part19',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part20',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part21',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part22',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part23',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part24',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part25',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part26',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part27',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part28',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part29',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part30',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part31',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part32',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part33',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part34',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part35',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part36',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part37',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part38',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part39',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part40',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part41',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part42',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part43',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part44',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part45',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/data/cgh%20big%20update%20v2.part46',
      ];

      const WASM_PARTS = [
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/wasm/cgh%20big%20update%20v2.part1',
        'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/Build/wasm/cgh%20big%20update%20v2.part2',
      ];


      function setBar(pct) {
        document.getElementById('loading-bar-inner').style.width = Math.min(100, pct).toFixed(1) + '%';
      }
      function setStatus(msg) { document.getElementById('loading-status').textContent = msg; }
      function setLabel(msg)  { document.getElementById('loading-label').textContent  = msg; }

      async function fetchPart(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + url);
        return res.arrayBuffer();
      }

      async function fetchAndCombine(urls, label, barStart, barEnd) {
        const buffers = [];
        for (let i = 0; i < urls.length; i++) {
          setStatus('Downloading ' + label + ' part ' + (i + 1) + ' / ' + urls.length);
          buffers.push(await fetchPart(urls[i]));
          setBar(barStart + (barEnd - barStart) * ((i + 1) / urls.length));
        }
        const totalBytes = buffers.reduce((s, b) => s + b.byteLength, 0);
        const out = new Uint8Array(totalBytes);
        let off = 0;
        for (const b of buffers) { out.set(new Uint8Array(b), off); off += b.byteLength; }
        return out.buffer;
      }

      function loadScript(url) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          s.onload  = resolve;
          s.onerror = () => reject(new Error('Script load failed: ' + url));
          document.head.appendChild(s);
        });
      }


      (async () => {
        try {
          setLabel('Loading engine...');
          setStatus('Fetching loader script...');
          await loadScript(LOADER_URL);
          setBar(2);

          setLabel('Loading .data (this may take a while)...');
          const dataBuffer = await fetchAndCombine(DATA_PARTS, 'DATA', 2, 65);

          setLabel('Loading .wasm...');
          const wasmBuffer = await fetchAndCombine(WASM_PARTS, 'WASM', 65, 90);

          setLabel('Starting game...');
          setStatus('Preparing blobs...');
          setBar(91);

          const dataObjectUrl = URL.createObjectURL(new Blob([dataBuffer]));
          const wasmObjectUrl = URL.createObjectURL(new Blob([wasmBuffer], { type: 'application/wasm' }));

          setStatus('Initialising Unity...');
          setBar(93);

          await createUnityInstance(document.querySelector('#unity-canvas'), {
            dataUrl:            dataObjectUrl,
            frameworkUrl:       FRAMEWORK_URL,
            codeUrl:            wasmObjectUrl,
            streamingAssetsUrl: 'https://cdn.jsdelivr.net/gh/UGBONTOP/CBUPV2Webport@main/StreamingAssets',
            companyName:        'KitKat_NotAWoman',
            productName:        'GORILLA TAG HORROR CLOUD EDITION (BIG UPDATE V2)',
            productVersion:     '1.1.15',
          }, (progress) => {
            setBar(93 + progress * 7);
            setStatus('Unity loading: ' + Math.round(progress * 100) + '%');
          });

          setBar(100);
          const overlay = document.getElementById('loading-overlay');
          overlay.style.transition = 'opacity 0.6s';
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 700);

          URL.revokeObjectURL(dataObjectUrl);
          URL.revokeObjectURL(wasmObjectUrl);

        } catch (err) {
          setLabel('Failed to load game');
          setStatus(err.message);
          console.error(err);
        }
      })();


      // ---------- Mobile touch controls ----------
      (() => {
        const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        if (!isTouch) return;

        const controls   = document.getElementById('mobile-controls');
        const tapHint     = document.getElementById('mobile-tap-hint');
        const lookLayer   = document.getElementById('look-layer');
        const joyZone     = document.getElementById('joystick-zone');
        const joyBase     = document.getElementById('joystick-base');
        const joyStick    = document.getElementById('joystick-stick');
        const jumpBtn     = document.getElementById('jump-btn');
        const sprintBtn   = document.getElementById('sprint-btn');

        tapHint.classList.add('active');

        function sendKey(type, code, key) {
          const evt = new KeyboardEvent(type, {
            code, key,
            keyCode: keyCodeFor(code),
            which:   keyCodeFor(code),
            bubbles: true,
            cancelable: true,
          });
          window.dispatchEvent(evt);
          document.dispatchEvent(evt);
        }
        function keyCodeFor(code) {
          const map = {
            KeyW: 87, KeyA: 65, KeyS: 83, KeyD: 68,
            Space: 32, ShiftLeft: 16,
            ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39,
          };
          return map[code] || 0;
        }

        // -------- Joystick: WASD --------
        const heldMoveKeys = new Set();
        function setMoveKeys(next) {
          for (const k of heldMoveKeys) if (!next.has(k)) sendKey('keyup', k, k[3].toLowerCase());
          for (const k of next) if (!heldMoveKeys.has(k)) sendKey('keydown', k, k[3].toLowerCase());
          heldMoveKeys.clear();
          for (const k of next) heldMoveKeys.add(k);
        }

        let joyPointerId = null;
        const JOY_RADIUS = 56;
        const JOY_DEADZONE = 10;

        function joyDirectionsFromAngle(dx, dy) {
          const dist = Math.hypot(dx, dy);
          if (dist < JOY_DEADZONE) return new Set();
          const deg = Math.atan2(-dy, dx) * (180 / Math.PI); // 0=right, 90=up
          const dirs = new Set();
          if (deg > -22.5 && deg <= 22.5)       dirs.add('KeyD');
          else if (deg > 22.5 && deg <= 67.5)   { dirs.add('KeyW'); dirs.add('KeyD'); }
          else if (deg > 67.5 && deg <= 112.5)  dirs.add('KeyW');
          else if (deg > 112.5 && deg <= 157.5) { dirs.add('KeyW'); dirs.add('KeyA'); }
          else if (deg > 157.5 || deg <= -157.5) dirs.add('KeyA');
          else if (deg > -157.5 && deg <= -112.5) { dirs.add('KeyS'); dirs.add('KeyA'); }
          else if (deg > -112.5 && deg <= -67.5) dirs.add('KeyS');
          else if (deg > -67.5 && deg <= -22.5)  { dirs.add('KeyS'); dirs.add('KeyD'); }
          return dirs;
        }

        function updateJoystick(clientX, clientY) {
          const rect = joyBase.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          let dx = clientX - cx;
          let dy = clientY - cy;
          const dist = Math.min(Math.hypot(dx, dy), JOY_RADIUS);
          const angle = Math.atan2(dy, dx);
          const sx = Math.cos(angle) * dist;
          const sy = Math.sin(angle) * dist;
          joyStick.style.transform = `translate(${sx}px, ${sy}px)`;
          setMoveKeys(joyDirectionsFromAngle(dx, dy));
        }
        function resetJoystick() {
          joyStick.style.transform = 'translate(0px, 0px)';
          setMoveKeys(new Set());
        }

        joyZone.addEventListener('pointerdown', (e) => {
          if (joyPointerId !== null) return;
          joyPointerId = e.pointerId;
          joyZone.setPointerCapture(e.pointerId);
          updateJoystick(e.clientX, e.clientY);
          e.preventDefault();
        }, { passive: false });
        joyZone.addEventListener('pointermove', (e) => {
          if (e.pointerId !== joyPointerId) return;
          updateJoystick(e.clientX, e.clientY);
          e.preventDefault();
        }, { passive: false });
        function endJoystick(e) {
          if (e.pointerId !== joyPointerId) return;
          joyPointerId = null;
          resetJoystick();
        }
        joyZone.addEventListener('pointerup', endJoystick);
        joyZone.addEventListener('pointercancel', endJoystick);

        // -------- Jump / Sprint buttons --------
        function bindHoldButton(el, code, key) {
          let pid = null;
          el.addEventListener('pointerdown', (e) => {
            if (pid !== null) return;
            pid = e.pointerId;
            el.setPointerCapture(e.pointerId);
            el.classList.add('pressed');
            sendKey('keydown', code, key);
            e.preventDefault();
          }, { passive: false });
          function release(e) {
            if (e.pointerId !== pid) return;
            pid = null;
            el.classList.remove('pressed');
            sendKey('keyup', code, key);
          }
          el.addEventListener('pointerup', release);
          el.addEventListener('pointercancel', release);
        }
        bindHoldButton(jumpBtn, 'Space', ' ');
        bindHoldButton(sprintBtn, 'ShiftLeft', 'Shift');

        // -------- Swipe look: pulses of arrow keys --------
        let lookPointerId = null;
        let lastX = 0, lastY = 0;
        const LOOK_PULSE_PX = 8;

        function pulseKey(code, key) {
          sendKey('keydown', code, key);
          setTimeout(() => sendKey('keyup', code, key), 16);
        }

        lookLayer.addEventListener('pointerdown', (e) => {
          if (lookPointerId !== null) return;
          lookPointerId = e.pointerId;
          lastX = e.clientX;
          lastY = e.clientY;
          lookLayer.setPointerCapture(e.pointerId);
          e.preventDefault();
        }, { passive: false });

        lookLayer.addEventListener('pointermove', (e) => {
          if (e.pointerId !== lookPointerId) return;
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          if (Math.abs(dx) >= LOOK_PULSE_PX || Math.abs(dy) >= LOOK_PULSE_PX) {
            if (Math.abs(dx) > Math.abs(dy)) {
              pulseKey(dx > 0 ? 'ArrowRight' : 'ArrowLeft', dx > 0 ? 'ArrowRight' : 'ArrowLeft');
            } else {
              pulseKey(dy > 0 ? 'ArrowDown' : 'ArrowUp', dy > 0 ? 'ArrowDown' : 'ArrowUp');
            }
            lastX = e.clientX;
            lastY = e.clientY;
          }
          e.preventDefault();
        }, { passive: false });

        function endLook(e) {
          if (e.pointerId !== lookPointerId) return;
          lookPointerId = null;
        }
        lookLayer.addEventListener('pointerup', endLook);
        lookLayer.addEventListener('pointercancel', endLook);

        // -------- Reveal controls on first tap --------
        function revealControls(e) {
          controls.classList.add('active');
          tapHint.classList.remove('active');
          document.removeEventListener('pointerdown', revealControls, true);
        }
        document.addEventListener('pointerdown', revealControls, true);
      })();
    </script>
  </body>
